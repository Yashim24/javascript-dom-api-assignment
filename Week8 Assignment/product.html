<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my Product Catalogue Assignment</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #222;
    }

    .product-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 30px auto;
    }

    .product-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .product-card h2 {
      color: #333;
      font-size: 20px;
    }

    .category {
      color: #666;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
    }

    .high-price {
      color: red;
    }

    .low-price {
      color: green;
    }
  </style>
</head>

<body>
  <h1>Product Catalogue</h1>

  <div class="product-container" id="productContainer"></div>

  <script src="produt.js"></script>
</body>
</html>
