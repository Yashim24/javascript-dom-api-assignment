<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registered New Users</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px 20px;
      background-color: #f4f7fb;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #243b55;
    }

    #showUsernames {
      display: block;
      margin: 20px auto;
      padding: 12px 22px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    #showUsernames:hover {
      background-color: #1d4ed8;
    }

    #usernames {
      max-width: 600px;
      margin: 20px auto;
      padding: 0;
      list-style: none;
    }

    #usernames li {
      background: white;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      border-left: 4px solid #2563eb;
    }

    #usersContainer {
      display: grid;
      grid-template-columns: repeat(
        auto-fit, minmax(250px, 1fr)
      );
      gap: 20px;
      max-width: 1100px;
      margin: 30px auto;
    }

    .user-card {
      background-color: white;
      padding: 22px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      border-top: 4px solid #2563eb;
    }

    .user-card h2 {
      color: #243b55;
      font-size: 20px;
      margin-top: 0;
    }

    .user-card p {
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .label {
      font-weight: bold;
      color: #475569;
    }

    #status {
      text-align: center;
      color: #64748b;
    }
  </style>
</head>

<body>
  <h1>Registered Users</h1>

  <button id="showUsernames">Show Usernames</button>

  <ul id="usernames" hidden></ul>

  <p id="status">Loading users...</p>

  <div id="usersContainer"></div>

    <script src="user.js"></script>
</body>
</html>
