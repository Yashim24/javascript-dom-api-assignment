<!DOCTYPE html>
<html>
<head>
    <title>My Student Result Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f4;
        }

        h2 {
            color: darkblue;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background-color: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: darkblue;
            color: white;
        }

        .passed {
            color: green;
            font-weight: bold;
        }

        .failed {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Student Result Checker</h2>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Score</th>
                <th>Result</th>
            </tr>
        </thead>
        <tbody id="resultTable"></tbody>
    </table>

    <script src="studentresult.js"></script>
    

</body>
</html>
